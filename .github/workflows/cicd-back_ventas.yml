name: CI/CD Innovatech - Backend Ventas

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "back-ventas/**"

jobs:
  build-push-deploy-ventas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend Ventas y push a ECR
      run: |
        cd back-ventas
        docker build -t backend-ventas .
        docker tag backend-ventas:latest ${{ secrets.ECR_REPO_URL_BACK_VENTA }}:latest
        docker push ${{ secrets.ECR_REPO_URL_BACK_VENTA }}:latest

    - name: Desplegar Backend Ventas en ECS
      run: |
        aws ecs update-service \
          --cluster innovatech-cluster \
          --service servicio-ventas \
          --force-new-deployment \
          --region ${{ secrets.AWS_REGION }}